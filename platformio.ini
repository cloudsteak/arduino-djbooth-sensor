; AR-NANOCH-TYPE-C (HESTORE): ATmega328P + CH340, USB Type-C.
; This board answers the new bootloader at 115200 baud
; (Arduino IDE: Processor = ATmega328P).
; env:nano is the old bootloader (57600) if a later board needs it.

[platformio]
default_envs = sipp_djbooth_sensor

[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    adafruit/RTClib@^2.1.4

[env:nano]
board = nanoatmega328

[env:sipp_djbooth_sensor]
board = nanoatmega328new
